<!DOCTYPE html>
<html lang="en">

<div th:replace="~{fragments/head :: head('Tutorials')}"></div>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/tutorial-sidebar :: tutorial-sidebar}">
            </div>
        </aside>

        <!-- Main content -->
        <main class="col-md-9 col-lg-10 p-4">

            <!-- Welcome -->
            <article th:if="${page.chapter == null}">

                <h1>Welcome to the tutorials</h1>

                <p>
                    Select a chapter or section from the sidebar to begin.
                </p>

            </article>


            <!-- Chapter -->
            <article
                    th:if="${page.chapter != null and page.section == null}">

                <h1 th:text="${page.chapter.title}">
                    Chapter title
                </h1>

                <div
                        th:if="${page.chapter.content != null and !page.chapter.content.isEmpty()}"
                        th:utext="${page.chapter.content}">
                    Chapter content
                </div>


                <!-- Chapter quizzes -->
                <div
                        th:if="${page.quizzes != null and !page.quizzes.isEmpty()}">

                    <h2>Quizzes</h2>

                    <div th:each="quiz : ${page.quizzes}">

                        <a
                                class="quiz-start-button"
                                th:href="@{/tutorials/chapters/{chapterId}/quizzes/{quizId}(
                                    chapterId=${page.chapter.id},
                                    quizId=${quiz.id}
                                )}"
                                th:attr="data-quiz-url=@{/api/quizzes/chapters/{chapterId}/{quizId}(
                                    chapterId=${page.chapter.id},
                                    quizId=${quiz.id}
                                )}"
                                th:text="${quiz.title}">
                            Start Quiz
                        </a>

                    </div>

                </div>

            </article>


            <!-- Section -->
            <article th:if="${page.section != null}">

                <h1 th:text="${page.section.title}">
                    Section title
                </h1>
                <div th:utext="${page.section.content}">
                    Section content
                </div>

                <div
                        th:if="${page.section.advancedContent != null}"
                        th:utext="${page.section.advancedContent}">
                    Advanced content
                </div>


                <!-- Section quizzes -->
                <div
                        th:if="${page.quizzes != null and !page.quizzes.isEmpty()}">

                    <h2>Quizzes</h2>

                    <div th:each="quiz : ${page.quizzes}">

                        <a
                                class="quiz-start-button"
                                th:href="@{/tutorials/chapters/{chapterId}/sections/{sectionId}/quizzes/{quizId}(
                                    chapterId=${page.chapter.id},
                                    sectionId=${page.section.id},
                                    quizId=${quiz.id}
                                )}"
                                th:attr="data-quiz-url=@{/api/quizzes/sections/{chapterId}/{sectionId}/{quizId}(
                                    chapterId=${page.chapter.id},
                                    sectionId=${page.section.id},
                                    quizId=${quiz.id}
                                )}"
                                th:text="${quiz.title}">
                            Start Quiz
                        </a>

                    </div>

                </div>

            </article>

        </main>

    </div>
</div>

<div th:replace="~{fragments/quiz-modal :: quiz-modal}"></div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
