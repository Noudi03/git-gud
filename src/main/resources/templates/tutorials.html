<!DOCTYPE html>
<html lang="en">

<div th:replace="~{fragments/head :: head('Tutorials')}"></div>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/tutorial-sidebar :: tutorial-sidebar}">
            </div>
        </aside>

        <!-- Main content -->
        <main class="col-md-9 col-lg-10 p-4">

            <article th:if="${page.section != null}">

                <h1 th:text="${page.section.title}">
                    Section title
                </h1>

                <div th:text="${page.section.content}">
                    Section content
                </div>

                <div
                        th:if="${page.section.advancedContent != null}"
                        th:text="${page.section.advancedContent}">
                    Advanced content
                </div>

                <div
                        th:if="${page.quizzes != null and !page.quizzes.isEmpty()}">

                    <h2>Quizzes</h2>

                    <div th:each="quiz : ${page.quizzes}">

                        <a
                                class="quiz-start-button"
                                th:href="@{/tutorials/chapters/{chapterId}/sections/{sectionId}/quizzes/{quizId}(
                                    chapterId=${page.chapter.id},
                                    sectionId=${page.section.id},
                                    quizId=${quiz.id}
                                )}"
                                th:attr="data-quiz-url=@{/api/quizzes/sections/{chapterId}/{sectionId}/{quizId}(
                                    chapterId=${page.chapter.id},
                                    sectionId=${page.section.id},
                                    quizId=${quiz.id}
                                )}"
                                th:text="${quiz.title}">
                            Start Quiz
                        </a>

                    </div>

                </div>

            </article>

            <article th:if="${page.section == null}">

                <h1>Welcome to the tutorials</h1>

                <p>Select a section from the sidebar to begin.</p>

            </article>

        </main>

    </div>
</div>

<div th:replace="~{fragments/quiz-modal :: quiz-modal}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
