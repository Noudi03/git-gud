<!DOCTYPE html>
<html lang="en">

<div th:replace="~{fragments/head :: head('Tutorials')}"></div>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/tutorial-sidebar :: tutorial-sidebar}">
            </div>
        </aside>

        <!-- Main content -->
        <main class="col-md-9 col-lg-10 p-4">

            <article th:if="${section != null}">

                <h1 th:text="${section.title}">
                    Section title
                </h1>

                <div th:text="${section.content}">
                    Section content
                </div>

                <div th:if="${section.advancedContent != null}"
                     th:text="${section.advancedContent}">
                    Advanced content
                </div>

                <div th:if="${quizzes != null and !quizzes.isEmpty()}">

                    <h2>Quizzes</h2>

                    <div th:each="quiz : ${quizzes}">

                        <button
                                type="button"
                                class="quiz-start-button"

                                th:attr="
                                    data-quiz-id=${quiz.id},
                                    data-chapter-id=${chapter.id},
                                    data-section-id=${section.id}
                                "

                                th:text="${quiz.title}">
                            Start Quiz
                        </button>

                    </div>

                </div>

            </article>

            <article th:if="${section == null}">

                <h1>Welcome to the tutorials</h1>

                <p>Select a section from the sidebar to begin.</p>

            </article>

        </main>

    </div>
</div>

<div th:replace="~{fragments/quiz-modal :: quiz-modal}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
