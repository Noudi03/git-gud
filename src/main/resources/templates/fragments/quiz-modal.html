<div th:fragment="quiz-modal"
     id="quiz-modal"
     class="quiz-modal"
     hidden>

    <div class="quiz-modal-overlay"></div>

    <div
            class="quiz-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="quiz-modal-title">

        <button
                type="button"
                id="quiz-close-button"
                class="quiz-close-button"
                aria-label="Exit quiz">
            &times;
        </button>

        <div class="quiz-header">

            <h2 id="quiz-modal-title">
                Quiz
            </h2>

            <span id="quiz-progress"
                  class="quiz-progress">
        </span>

        </div>

        <div id="quiz-modal-body">

            <h3 id="quiz-question"></h3>

            <div id="quiz-options"
                 class="quiz-options">
            </div>

            <div id="quiz-feedback"
                 class="quiz-feedback"
                 hidden>
            </div>

        </div>

        <div class="quiz-actions">

            <button
                    type="button"
                    id="quiz-skip-button"
                    class="quiz-button quiz-button-secondary">
                Skip for now
            </button>

            <button
                    type="button"
                    id="quiz-next-button"
                    class="quiz-button quiz-button-primary"
                    hidden>
                Next
            </button>

        </div>

    </div>

</div>
